name: auto-tag

# Cut THIS repo's own next vX.Y.Z tag (+ a GitHub Release) when its INSTALLABLE STATE
# changes on main. Delegates to dotfiles-core's reusable auto-tag-call.yml — one
# definition of the version math (scripts/auto-tag.sh), idempotent (a no-op when HEAD is
# already tagged vX.Y.Z). Generated by dotfiles-core/scripts/new-os-repo.sh at Core major
# v7.
#
# A DENYLIST, NOT AN ALLOWLIST, on purpose. The default answer is "this changed what gets
# installed, so cut a tag", and only what demonstrably does NOT ship is carved out. An
# allowlist fails the way `paths: ['core/**']` failed across the fleet: the tag tracked
# the vendored dependency and native work was released only by coincidence. The denylist's
# failure mode is a spurious patch tag — noisy, not wrong. `!` patterns are evaluated in
# order, so the exclusions override the `**` above.
on:
  push:
    branches: [main]
    paths:
      - '**'
      # Docs and licence — never installed. BOTH markdown forms: GitHub's filter-pattern
      # semantics for `**` spanning directory separators are not pinned down citably, and
      # this repo will grow nested markdown (.github/ISSUE_TEMPLATE/*.md).
      - '!**.md'
      - '!**/*.md'
      - '!LICENSE'
      # CI plumbing and the suite — neither is wired into $HOME by bootstrap.sh.
      - '!.github/**'
      - '!test/**'
      # Author-time tooling config.
      - '!.editorconfig'
      - '!.markdownlint.jsonc'
      - '!.pre-commit-config.yaml'
      - '!renovate.json'
  # The third SemVer component, reachable without editing this file. Safe to press at any
  # time: the reusable no-ops when HEAD already carries a vX.Y.Z tag.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which SemVer component to advance'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # the tag push + GitHub Release needs write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    uses: dotgibson/dotfiles-core/.github/workflows/auto-tag-call.yml@v7
    # `inputs` is empty on a push event, so this reads `patch` there and the chosen
    # component on a dispatch. One caller, both flows.
    with:
      bump: ${{ inputs.bump || 'patch' }}
