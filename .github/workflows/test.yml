name: test

# Generated by dotfiles-core/scripts/new-os-repo.sh. Runs this repo's own suite, which is
# the fleet's test floor (dotfiles-core's VENDORING.md § "The `make` vocabulary, and the
# test floor" — in the source repo, not under core/):
# a populated test/ directory, run from a workflow. `make test` is what runs here, so
# "passes locally" and "passes CI" are the same command.
on:
  push:
    # Both, like the fleet's callers. The scaffold itself is born on main (whatever the
    # author's init.defaultBranch says), so this filter cannot miss the repo's own pushes.
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test

  # THE ONLY PLACE nix/*.nix IS ACTUALLY PARSED. `make test` above runs check-nix.sh too,
  # but ubuntu-latest has no nix, so there it skips — and a gate that only ever skips is
  # not a gate. This job runs the same script in a container that has nix.
  #
  # Syntax only (`nix-instantiate --parse`): no channels, no network, no nixpkgs, no
  # attribute resolution. A typo'd package name in home.packages still passes here — that
  # needs a real `home-manager build`, which is documented in nix/README.md as an
  # on-demand check rather than wired in as a gate.
  nix-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse nix/*.nix in a container that has nix
        # `docker run` rather than a job-level `container:`, for the same two reasons
        # dotfiles-core's bootstrap-test.yml gives:
        #
        #  1. actions/checkout is a JavaScript action and the runner mounts its own node
        #     into the container. nixos/nix has no loader for it, so a job-level
        #     `container: nixos/nix:latest` dies at checkout with
        #     "exec /__e/node24/bin/node: no such file or directory" — measured, on this
        #     repo's first push. Checking out on the host and mounting the tree sidesteps it.
        #  2. Core's modern-baseline check requires every `container:`/`image:` value to be
        #     digest-pinned; a bare tag in that position is a finding.
        #
        # Keep the script below apostrophe-free: it lives inside a single-quoted sh -euc
        # argument.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo nixos/nix:latest sh -euc '
            nix-channel --update
            nix-env -iA nixpkgs.bash
            exec ./test/check-nix.sh
          '
